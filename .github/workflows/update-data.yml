name: Update CardRadar data

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl public sources
        run: npm run crawl

      - name: Validate generated data
        run: npm run validate:data

      - name: Commit data changes
        run: |
          if git diff --quiet -- public/data; then
            echo "No public/data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): update public credit card intelligence"
          git push
